# Faster local builds on Apple Silicon / multi-core hosts.
[build]
# Prefer sparse index (default on modern Cargo; keep explicit for older toolchains).
jobs = 10

[term]
quiet = false

# Cranelift is faster to compile but not default on stable; leave linker alone on macOS
# (ld64 is fine). Install `sccache` and set RUSTC_WRAPPER=sccache for cross-crate caching.
