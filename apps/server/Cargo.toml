[package]
name = "jet"
version = "0.1.0"
description = "Jet single-binary web application"
authors = ["Gharargah"]
edition = "2021"

[lib]
name = "jet_server"
path = "src/lib.rs"

[[bin]]
name = "jet"
path = "src/main.rs"

[[bin]]
name = "gharargah-mock-acp"
path = "src/bin/gharargah-mock_acp.rs"

[[bin]]
name = "gharargah-mock-line-rpc"
path = "src/bin/gharargah-mock_line_rpc.rs"

[[bin]]
name = "gharargah-mock-claude-sdk"
path = "src/bin/gharargah-mock_claude_sdk.rs"

[dependencies]
agent-client-protocol = { version = "1.3", features = ["unstable_elicitation"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fff-search = "0.9.6"
futures-util = "0.3"
http = "1"
mime_guess = "2"
notify = "6"
open = "5"
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
# Default: debug reads FE from disk; release embeds. Do not enable `debug-embed`.
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = "0.24"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.24"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Dev: line tables only → much faster codegen/link than full debuginfo.
[profile.dev]
debug = "line-tables-only"

# Release: no LTO + parallel CGUs for fast iteration.
# Full LTO + CGU=1 was ~87–100s+ for a single-crate rebuild.
# Use --profile release-max when shipping a size/perf-tuned binary.
[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 3
strip = true

[profile.release-max]
inherits = "release"
codegen-units = 1
lto = true
