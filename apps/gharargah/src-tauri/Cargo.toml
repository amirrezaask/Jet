[package]
name = "gharargah-desktop"
version = "0.0.1"
description = "Gharargah desktop shell"
authors = ["Gharargah"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 3
strip = true

[profile.release-max]
inherits = "release"
codegen-units = 1
lto = true
